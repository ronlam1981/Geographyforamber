<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="初二地理小測：疆域、人口、民族、地形與地勢。分章複習、地圖填空、25分鐘模擬測驗及錯題重溫。"><title>地理研習室｜初二地理學習與測驗</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="#home">🌏 地理研習室<small>從世界看中國 · 地形與地勢</small></a><div class="head-actions"><button id="sound" aria-pressed="false">🔇 音效</button><button id="user" onclick="login()">🎒 學生</button></div></header>
<nav aria-label="主選單"><button data-view="home">🏠 概覽</button><button data-view="notes">📖 重點複習</button><button data-view="practice">🎯 分章練習</button><button data-view="map">🗺️ 地圖填空</button><button data-view="exam">⏱️ 模擬測驗</button><button data-view="stats">📊 學習記錄</button></nav>
<main id="app"></main><footer>非官方學習工具 · 依課堂範圍編寫，原創題目並非學校試卷。<br>學習記錄保存在目前裝置及瀏覽器；可匯出備份，未設跨裝置同步。</footer>
<dialog id="loginDialog"><form method="dialog"><h2>選擇角色</h2><p>學生可直接使用；家長可管理題庫與檢視本機所有記錄。</p><label>角色<select id="role"><option value="student">學生</option><option value="parent">家長</option></select></label><label id="nameLabel">學生暱稱<input id="name" maxlength="20" placeholder="同學"></label><label id="pinLabel" hidden>家長密碼<input id="pin" type="password" inputmode="numeric" autocomplete="off"></label><p id="loginError" class="bad"></p><button type="button" onclick="doLogin()">進入</button><button class="secondary">取消</button><p class="muted">家長密碼是本機操作鎖，不是雲端帳戶驗證。</p></form></dialog>
<dialog id="manageDialog"><h2>新增練習題</h2><form id="addForm"><label>章節<select id="addChapter"></select></label><label>題型<select id="addType"><option value="fill">填空</option><option value="short">簡答</option><option value="mc">選擇</option></select></label><label>題目<textarea id="addQ" required></textarea></label><label>答案（選擇題填 A／B／C／D）<input id="addAnswer" required></label><label>選擇題四個選項，每行一個<textarea id="addOptions"></textarea></label><label>解說<textarea id="addExplain" required></textarea></label><button>儲存題目</button><button type="button" class="secondary" onclick="document.getElementById('manageDialog').close()">取消</button></form></dialog>
<script src="data.js"></script><script src="app.js"></script></body></html>
